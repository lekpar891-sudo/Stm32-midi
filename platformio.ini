[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
board_build.variant = generic_f103c
board_build.mcu = stm32f103c8t6
framework = arduino
lib_deps =
  MIDIUSB
  EEPROM
monitor_speed = 115200
build_unflags = -Wl,--entry=Reset_Handler
build_flags =
  -D USB_MIDI_BUILD
; Optional: if you rely on specific platform/core versions, pin them:
; platform = ststm32@~19.4.0
