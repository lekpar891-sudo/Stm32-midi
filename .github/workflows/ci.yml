on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install -U pip
          pip install platformio

      - name: Show PlatformIO versions
        run: |
          platformio --version
          pio platform show ststm32 || true

      - name: Clean repo build cache
        run: |
          if [ -d .pio ]; then rm -rf .pio; fi

      - name: Install specific ststm32 platform (stable)
        run: |
          pio platform install ststm32@~8.0.0 || true
          pio platform show ststm32

      - name: PlatformIO - Run build
        run: |
          platformio run -e bluepill_f103c8
